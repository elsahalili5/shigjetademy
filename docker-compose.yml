services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shigjetademy
      POSTGRES_PASSWORD: shigjetademy
      POSTGRES_DB: shigjetademy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shigjetademy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
